name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and verify ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi libpng-dev

      - name: Cache agbcc
        id: cache-agbcc
        uses: actions/cache@v4
        with:
          path: game/tools/agbcc
          key: agbcc-${{ runner.os }}-v1

      - name: Build agbcc
        if: steps.cache-agbcc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/pret/agbcc /tmp/agbcc
          cd /tmp/agbcc
          ./build.sh
          ./install.sh "$GITHUB_WORKSPACE/game"

      # The hack intentionally diverges from the retail ROM, so there is no
      # checksum to compare against; a successful build is the gate.
      - name: Build ROM
        run: |
          cd game
          make -j"$(nproc)"

      # Short retention: artifacts are for playtesting builds, not
      # distribution — long-term releases should ship as patch files.
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-ante-${{ github.sha }}
          path: game/pokefirered.gba
          retention-days: 7
          if-no-files-found: error

      # Rolling pre-release so the latest playtest build is one click from
      # the repo front page — no digging through Actions runs.
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp game/pokefirered.gba pokemon-ante-latest.gba
          gh release view latest-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest-build --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "Latest playtest build" \
              --notes "Rolling build of the most recent push."
          gh release upload latest-build pokemon-ante-latest.gba \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit latest-build --repo "$GITHUB_REPOSITORY" \
            --notes "Rolling playtest build. Commit: ${GITHUB_SHA} (${GITHUB_REF_NAME}). $(date -u +%Y-%m-%dT%H:%MZ)"
