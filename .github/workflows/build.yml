name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build and verify ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi libpng-dev

      - name: Cache agbcc
        id: cache-agbcc
        uses: actions/cache@v4
        with:
          path: game/tools/agbcc
          key: agbcc-${{ runner.os }}-v1

      - name: Build agbcc
        if: steps.cache-agbcc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/pret/agbcc /tmp/agbcc
          cd /tmp/agbcc
          ./build.sh
          ./install.sh "$GITHUB_WORKSPACE/game"

      - name: Build ROM and verify checksum
        run: |
          cd game
          make -j"$(nproc)" compare
